{% extends 'adparent.html' %}
{%block d%}
:: Course
{%endblock%}
{% block body %}

<div class="row my-5">
  <div class="col-md-8 mx-auto ">
    <!-- Add Course Form -->
    <form action="" method="POST" class="w-75 mx-auto shadow-lg rounded-4 p-5" style="box-shadow: 0 0 10px  rgba(13, 202, 240, 0.8) !important;">
      {% csrf_token %}
      <h1 class="text-info fw-bold text-center mb-4">Add Course</h1>


      <label for="" class=" text-light fw-bold pb-2">Enter Course Name:</label>
      <input type="text" value="{{i.course}}" name="course" class="form-control rounded-pill mb-3 st" placeholder="Enter Course Name" />

      <input type="submit" value="Add Course" class="btn btn-outline-info form-control rounded-pill fw-bold" />
    </form>
  </div>
</div>

<!-- View Course Table -->
<div class="row mt-5">
  <div class="col-md-8 p-5 mx-auto bg-light rounded-3 table-responsive shadow-lg">
    <h3 class="text-dark mb-4 fw-bold"><i class="fa fa-book-open text-info me-2 fa-bounce"></i>View Course</h3>
    <table class="table table-hover align-middle text-center shadow-sm-rounded-3 overflow-hidden">
      <thead class="table-dark">
        <tr>
          <th scope="col">S.no</th>
          <th scope="col">Course Name</th>
          <th scope="col" colspan="2">Action</th>
        </tr>
      </thead>
      <tbody>
        {% for i in cr%}
        <tr>
          <td class="fw-semibold">{{forloop.counter}}</td>
          <td class="fw-bold">{{i.course}}</td>
          <td>
            <a href="{%url 'adminapp:editcourse' i.id %}" class="btn btn-outline-warning btn-sm shadow-sm"><i class="fa fa-edit"></i> Edit
            </a></td>
            <a href="{%url 'adminapp:deletecourse' i.id %}" class="btn btn-outline-danger btn-sm shadow-sm"><i class="fa fa-trash"></i> Delete
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
