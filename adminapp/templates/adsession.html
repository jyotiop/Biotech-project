{% extends 'adparent.html' %}
{%block d%}
:: Session
{%endblock%}
 {% block body %}
<div class="row my-5">
  <div class="col-md-8 mx-auto">
    <!-- Add Session Form -->
    <form
      action=""
      method="post"
      class="w-75 mx-auto shadow-lg rounded-4 p-5"  style="box-shadow: 0 0 10px  rgba(13, 202, 240, 0.8) !important;" >
      {% csrf_token %}
      <h3 class="text-info fw-bold text-center mb-4">Add Session</h3>

      <label for="" class="text-light fw-bold pb-2">Enter Session:</label>
      <input
        type="text"
        value="{{i.session}}" 
        name="session"
        class="form-control rounded-pill mb-3 st"
        placeholder="Enter Session"/>

      <input
        type="submit"
        value="Add Session"
        class="btn btn-outline-info form-control rounded-pill fw-bold"
      />
    </form>
  </div>
</div>

<!-- View Session Table -->
<div class="row mt-5">
  <div class="col-md-8 p-5 mx-auto bg-light rounded-3 table-responsive shadow-lg">
    <h3 class=" text-dark mb-4 fw-bold"><i class="fa fa-calendar-days text-info me-2 fa-bounce"></i>View Session</h3>
    <table class="table table-hover align-middle text-center shadow-sm-rounded-3 overflow-hidden">
      <thead class="table-dark">
        <tr>
          <th scope="col">S.no</th>
          <th scope="col">Session</th>
          <th scope="col" colspan="2">Action</th>
        </tr>
      </thead>
      <tbody>
        {% for j in se%}
        <tr>
          <td class="fw-semibold">{{forloop.counter}}</td>
          <td class="fw-bold">{{j.session}}</td>
          <td>
            <a
            href="{%url 'adminapp:editsession' j.id %}"
              class="btn btn-outline-warning btn-sm shadow-sm"
            >
              <i class="fa fa-edit"></i> Edit
            </a>
            <a href="{%url 'adminapp:deletesession' j.id %}"
              class="btn btn-outline-danger btn-sm shadow-sm"
            >
              <i class="fa fa-trash"></i> Delete
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
