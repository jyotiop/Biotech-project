{% extends 'stuparent.html' %}
{% load static %}

{% block page_title %}<i class="fa-solid fa-comment-dots text-success me-2"></i> Submit Feedback or Complaint{% endblock %}

{% block body %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
      <h4 class="fw-bold text-dark mb-4 border-bottom pb-2">Submit Feedback / Query / Complaint</h4>

      <form action="{% url 'studentapp:stufeedback' %}" method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label small fw-semibold">Feedback Type <span class="text-danger">*</span></label>
          <select name="feedtype" class="form-select" required>
            <option value="">-- Choose Category --</option>
            <option value="Feedback">Feedback</option>
            <option value="Suggestion">Suggestion</option>
            <option value="Complain">Complain</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">Subject / Title <span class="text-danger">*</span></label>
          <input type="text" name="title" class="form-control" placeholder="Brief subject..." required>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold">Detailed Description <span class="text-danger">*</span></label>
          <textarea name="desc" class="form-control" rows="5" placeholder="Provide full details of your feedback or suggestion..." required></textarea>
        </div>

        <button type="submit" class="btn btn-success btn-lg rounded-pill px-5 shadow-sm fw-bold">
          <i class="fa-solid fa-paper-plane me-2"></i> Submit Feedback
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
