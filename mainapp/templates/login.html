{% extends 'parent.html' %}
{% load static %}

{% block title %}Student Login - Biotech Park OLP{% endblock %}

{% block body %}
<section class="py-5 min-vh-75 d-flex align-items-center bg-light">
  <div class="container px-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="form-glass p-4 p-md-5 rounded-4 shadow-lg border">
          <div class="text-center mb-4">
            <div class="icon-box-emerald mx-auto mb-3" style="width: 64px; height: 64px; border-radius: 18px;">
              <i class="fa-solid fa-user-graduate fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Student Login</h3>
            <p class="text-muted small">Access your study materials, news & feedback portal</p>
          </div>

          <form action="{% url 'mainapp:login' %}" method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="stuEmail" class="form-label text-dark small fw-semibold">Registered Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light border text-muted"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" id="stuEmail" name="email" class="form-control" placeholder="your.name@example.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="stuPass" class="form-label text-dark small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border text-muted"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="stuPass" name="password" class="form-control" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2.5 rounded-3 fw-bold shadow-sm">
              <i class="fa-solid fa-right-to-bracket me-2"></i> Login to Student Portal
            </button>

            <div class="text-center mt-4 pt-3 border-top">
              <p class="small text-muted mb-0">Don't have an account yet? <a href="{% url 'mainapp:registration' %}" class="text-success fw-bold text-decoration-none">Register Here</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
